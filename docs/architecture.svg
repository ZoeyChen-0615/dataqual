<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 16; ry: 16; }
      .box2 { fill: #ecfeff; stroke: #155e75; stroke-width: 2; rx: 16; ry: 16; }
      .box3 { fill: #fefce8; stroke: #854d0e; stroke-width: 2; rx: 16; ry: 16; }
      .text { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="50" y="55" class="title">DataQual Architecture</text>
  <text x="50" y="85" class="subtitle">async pipeline + rule registry + validation engine + sqlite + fastapi</text>

  <rect x="60" y="160" width="200" height="110" class="box2"/>
  <text x="100" y="205" class="text">DataProducer</text>
  <text x="95" y="235" class="small">generates synthetic records</text>
  <text x="96" y="257" class="small">injects null, type, range,</text>
  <text x="118" y="279" class="small">and duplicate issues</text>

  <rect x="340" y="160" width="200" height="110" class="box2"/>
  <text x="383" y="205" class="text">asyncio.Queue</text>
  <text x="387" y="240" class="small">batch handoff</text>

  <rect x="620" y="160" width="200" height="110" class="box2"/>
  <text x="662" y="205" class="text">DataConsumer</text>
  <text x="665" y="235" class="small">pulls batches</text>
  <text x="652" y="257" class="small">calls engine and storage</text>

  <rect x="900" y="130" width="230" height="140" class="box"/>
  <text x="945" y="180" class="text">ValidationEngine</text>
  <text x="960" y="210" class="small">builds context</text>
  <text x="941" y="232" class="small">runs selected rules</text>
  <text x="930" y="254" class="small">returns ValidationRunResult</text>

  <rect x="900" y="340" width="230" height="170" class="box3"/>
  <text x="965" y="385" class="text">RuleRegistry</text>
  <text x="943" y="415" class="small">decorator-based registration</text>
  <text x="953" y="437" class="small">null_check, type_check,</text>
  <text x="953" y="459" class="small">range_check, uniqueness,</text>
  <text x="982" y="481" class="small">anomaly_check</text>

  <rect x="620" y="420" width="200" height="110" class="box"/>
  <text x="660" y="465" class="text">StorageManager</text>
  <text x="661" y="495" class="small">writes runs and results</text>
  <text x="692" y="517" class="small">queries stats</text>

  <rect x="340" y="420" width="200" height="110" class="box"/>
  <text x="405" y="465" class="text">SQLite</text>
  <text x="365" y="495" class="small">validation_runs table</text>
  <text x="356" y="517" class="small">validation_results table</text>

  <rect x="60" y="420" width="200" height="110" class="box"/>
  <text x="125" y="465" class="text">FastAPI</text>
  <text x="101" y="495" class="small">health, rules, validate,</text>
  <text x="91" y="517" class="small">results, run detail, stats</text>

  <line x1="260" y1="215" x2="340" y2="215" class="arrow"/>
  <line x1="540" y1="215" x2="620" y2="215" class="arrow"/>
  <line x1="820" y1="215" x2="900" y2="215" class="arrow"/>
  <line x1="1015" y1="270" x2="1015" y2="340" class="arrow"/>
  <line x1="900" y1="475" x2="820" y2="475" class="arrow"/>
  <line x1="620" y1="475" x2="540" y2="475" class="arrow"/>
  <line x1="340" y1="475" x2="260" y2="475" class="arrow"/>

  <text x="64" y="610" class="subtitle">CLI entry points</text>
  <text x="64" y="638" class="small">start  |  serve  |  validate --file sample.csv  |  rules</text>
</svg>
